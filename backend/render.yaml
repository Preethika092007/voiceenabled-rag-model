services:
  - type: web
    name: echorag-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: starter # ML requires more than 512MB RAM, standard/starter usually 512MB but pro is recommended.
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: "https://your-vercel-domain.vercel.app"
      - key: LLM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
